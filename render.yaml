services:
  - type: web
    name: urbanshade-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: INFRARED_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
